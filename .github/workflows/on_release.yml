name: "Release"

on:
  push:
    tags:
      - "*"

jobs:
  build:
    name: Build 🛠️
    uses: ./.github/workflows/run_build.yml

  release:
    needs:
      - build
    name: Create Release 📢
    runs-on: ubuntu-26.04
    steps:
      - name: Download x86_64 Tarball 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-x86_64

      - name: Download aarch64 Tarball 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-aarch64

      - name: Generate Checksums 🔑
        run: |
          sha256sum nixos.wsl > nixos.wsl.sha256
          sha256sum nixos.aarch64.wsl > nixos.aarch64.wsl.sha256

      - name: Attach to Release 📎
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            nixos.wsl
            nixos.wsl.sha256
            nixos.aarch64.wsl
            nixos.aarch64.wsl.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
