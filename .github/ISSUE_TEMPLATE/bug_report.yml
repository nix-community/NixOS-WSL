name: Bug Report
description: File a bug report to help us improve NixOS-WSL
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: markdown
    attributes:
      value: |
        # Information About the Bug

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Tell us how to reproduce this behavior.
      placeholder: |
        1. Enable option '...'
        2. Run on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant Configuration
      description: Please share relevant parts of your NixOS configuration.
      placeholder: |
        wsl = {
          enable = true;
          defaultUser = "your-username";
          useWindowsDriver = true; # or false
          interop.enabled = true;  # or false
          # ... other wsl.* options you've configured
        };

        ...
      render: nix

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: If applicable, add relevant logs or error messages.
      placeholder: |
        Include any relevant logs, error messages, or command output.

        You can often find logs in:
        - `journalctl` output
        - `dmesg` output
        - WSL logs (see https://github.com/microsoft/WSL/blob/master/diagnostics/collect-wsl-logs.ps1)

  - type: markdown
    attributes:
      value: |
        # Information About Your System

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Select the CPU architecture of your system.
      options:
        - x86_64 (Intel/AMD)
        - aarch64 (ARM)
    validations:
      required: true

  - type: input
    id: nixos-wsl-version
    attributes:
      label: NixOS-WSL Version Information
      description: |
          Run this command in your **NixOS-WSL** terminal and paste the output here:

          ```
          nixos-wsl-version
          ```

          If the command doesn't exist or fails, please provide:
          - Contents of /etc/os-release
          - Output of: cat /etc/nixos-wsl-release (if file exists)
          - Your installation method and source
      placeholder: "NixOS-WSL xx.xx.xx.xx abcdef123456"
    validations:
      required: true

  - type: input
    id: wsl-version
    attributes:
      label: WSL Version
      description: |
          Run this command on your **Windows** terminal and paste the output here:

          ```
          wsl --version
          ```
      placeholder: "2.x.x.x"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      description: |
          Reun this command on your **Windows** terminal and paste the line containing _Version_ and _Build_ here:

          ```
          winver
          ```
      placeholder: "Version xxHx (Build xxxxx.xxxx)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        # Additional Information

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Screenshots, workarounds you've tried, or any other information that might be helpful.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I have searched existing issues to make sure this is not a duplicate.
          required: true
        - label: I have included all relevant information in the fields above
          required: true
        - label: I have provided clear steps to reproduce the issue.
          required: true
